include:
  - monitoring/compose.monitoring.yml

services:
  front:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: quizbattle-frontend:${TAG:-latest}
    restart: unless-stopped
    environment:
      SERVICE: front
      VERSION: ${TAG:-dev}
      GROUPE: ${GROUPE:?GROUPE manquant dans le .env}
      COULEUR: ${COULEUR_FRONT:-#3498db}
      TABLEAU_URL: ${TABLEAU_URL:?TABLEAU_URL manquant dans le .env}
      URL_INTERNE: http://front:3000
    ports:
      - "3003:3000"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: quizbattle-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-quizbattle}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans le .env}@db:5432/${POSTGRES_DB:-quizbattle}
      SERVICE: api
      VERSION: ${TAG:-dev}
      GROUPE: ${GROUPE:?GROUPE manquant dans le .env}
      COULEUR: ${COULEUR_API:-#2ecc71}
      TABLEAU_URL: ${TABLEAU_URL:?TABLEAU_URL manquant dans le .env}
      URL_INTERNE: http://api:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizbattle}
      POSTGRES_USER: ${POSTGRES_USER:-quizbattle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans le .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
