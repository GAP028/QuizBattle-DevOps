<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizBattle</title>

    <style>
        /* Apparence générale de la page */
        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        /* Carte contenant le quiz */
        .quiz {
            background: #1e293b;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        /* Boutons de réponse */
        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            background: #e2e8f0;
        }

        button:hover {
            background: #93c5fd;
        }

        /* Affichage du score */
        .score {
            color: #4ade80;
            font-size: 20px;
        }

        /* Chronomètre */
        .chrono {
            color: #fbbf24;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>⚡ QuizBattle</h1>
    <p>Affrontez vos camarades dans un quiz informatique !</p>

    <div class="quiz">

        <!-- Chronomètre -->
        <p class="chrono">
            Temps restant : <span id="temps">15</span>s
        </p>

        <!-- Score actuel -->
        <p class="score">
            Score : <span id="score">0</span>
        </p>

        <!-- Question -->
        <h2 id="question"></h2>

        <!-- Réponses générées par JavaScript -->
        <div id="reponses"></div>

        <!-- Message après une réponse -->
        <p id="message"></p>

    </div>

    <script>
        // Adresse de l'API (modifiable avant ce script via window.QUIZBATTLE_API_URL)
        const API_URL = window.QUIZBATTLE_API_URL || "http://localhost:3002";

        // Questions de la partie, chargées uniquement depuis l'API (PostgreSQL)
        let questions = [];

        // Code de la partie en cours, fourni par l'API : il identifie le joueur
        let codePartie = null;

        // Charger les questions depuis l'API
        // Quiz choisi : paramètre ?quiz=ID, sinon le premier quiz qui contient des questions
        async function chargerQuestions() {
            const options = { signal: AbortSignal.timeout(3000) };
            let quizId = new URLSearchParams(window.location.search).get("quiz");

            if (!quizId) {
                const reponseQuiz = await fetch(API_URL + "/api/quiz", options);
                if (!reponseQuiz.ok) throw new Error("HTTP " + reponseQuiz.status);

                const listeQuiz = await reponseQuiz.json();
                const quiz = listeQuiz.find((q) => q.nb_questions > 0);
                if (!quiz) throw new Error("aucun quiz avec des questions");

                quizId = quiz.id;
            }

            const reponse = await fetch(API_URL + "/api/quiz/" + quizId + "/questions", options);
            if (!reponse.ok) throw new Error("HTTP " + reponse.status);

            const donnees = await reponse.json();
            if (donnees.length === 0) throw new Error("quiz sans questions");

            // Adapter le format de l'API au format utilisé par le quiz
            // (la bonne réponse n'est pas envoyée : c'est l'API qui la vérifie)
            questions = donnees.map((q) => ({
                id: q.id,
                question: q.enonce,
                reponses: q.options.map((option) => option.libelle),
                optionIds: q.options.map((option) => option.id),
                duree: q.duree_secondes
            }));

            return quizId;
        }

        // Créer une partie côté API : chaque réponse y sera enregistrée
        async function creerPartie(quizId) {
            const reponse = await fetch(API_URL + "/api/quiz/" + quizId + "/parties", {
                method: "POST",
                signal: AbortSignal.timeout(3000)
            });
            if (!reponse.ok) throw new Error("HTTP " + reponse.status);

            const partie = await reponse.json();
            codePartie = partie.code;
        }

        // Charger le quiz, créer la partie puis la lancer, ou afficher l'erreur
        function demarrer() {
            document.getElementById("question").textContent = "Chargement du quiz...";
            document.getElementById("reponses").innerHTML = "";
            document.getElementById("message").textContent = "";

            chargerQuestions()
                .then(creerPartie)
                .then(() => {
                    indexQuestion = 0;
                    score = 0;
                    document.getElementById("score").textContent = score;
                    afficherQuestion();
                })
                .catch(afficherErreur);
        }

        // Envoyer la réponse à l'API (optionId null : temps écoulé), puis passer à la suite
        async function envoyerReponse(optionId) {

            // Ignorer les clics pendant l'envoi
            if (envoiEnCours) return;
            envoiEnCours = true;

            clearInterval(intervalle);

            const questionActuelle = questions[indexQuestion];

            try {
                const reponse = await fetch(API_URL + "/api/parties/" + codePartie + "/reponses", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        question_id: questionActuelle.id,
                        option_id: optionId,
                        temps_reponse_ms: Date.now() - debutQuestion
                    }),
                    signal: AbortSignal.timeout(3000)
                });
                if (!reponse.ok) throw new Error("HTTP " + reponse.status);

                const resultat = await reponse.json();

                // Le score affiché est celui calculé et enregistré par l'API
                score = resultat.score;
                document.getElementById("score").textContent = score;
            } catch (erreur) {
                envoiEnCours = false;
                afficherErreur(erreur);
                return;
            }

            envoiEnCours = false;

            // Passer à la question suivante
            indexQuestion++;
            afficherQuestion();
        }

        // Pas de questions de secours : on indique le problème et on propose de réessayer
        function afficherErreur(erreur) {
            console.error("Échange avec l'API impossible :", erreur.message);

            clearInterval(intervalle);

            document.getElementById("question").textContent =
                "Impossible de charger le quiz";

            document.getElementById("reponses").innerHTML = "";

            document.getElementById("message").textContent =
                "Vérifiez que l'API est démarrée sur " + API_URL + " (" + erreur.message + ")";

            const bouton = document.createElement("button");

            bouton.textContent = "Réessayer";

            bouton.onclick = demarrer;

            document.getElementById("reponses").appendChild(bouton);
        }

        // Variables permettant de suivre la partie
        let indexQuestion = 0;
        let score = 0;
        let temps = 15;
        let intervalle;
        let debutQuestion = 0;
        let envoiEnCours = false;

        // Afficher une question et ses réponses
        function afficherQuestion() {

            // Si toutes les questions sont terminées
            if (indexQuestion >= questions.length) {
                terminerQuiz();
                return;
            }

            const questionActuelle = questions[indexQuestion];

            document.getElementById("question").textContent =
                questionActuelle.question;

            document.getElementById("reponses").innerHTML = "";
            document.getElementById("message").textContent = "";

            // Créer un bouton pour chaque réponse
            questionActuelle.reponses.forEach((reponse, index) => {

                const bouton = document.createElement("button");

                bouton.textContent = reponse;

                bouton.onclick = () => verifierReponse(index);

                document.getElementById("reponses").appendChild(bouton);
            });

            // Réinitialiser le chronomètre (durée de la question en base, 15 s par défaut)
            temps = questionActuelle.duree || 15;
            document.getElementById("temps").textContent = temps;
            debutQuestion = Date.now();

            clearInterval(intervalle);

            // Diminuer le temps chaque seconde
            intervalle = setInterval(() => {

                temps--;

                document.getElementById("temps").textContent = temps;

                // Temps écoulé : la question est enregistrée sans réponse
                if (temps <= 0) {
                    envoyerReponse(null);
                }

            }, 1000);
        }

        // Vérifier la réponse sélectionnée (la vérification est faite par l'API)
        function verifierReponse(index) {
            envoyerReponse(questions[indexQuestion].optionIds[index]);
        }

        // Afficher le résultat final
        function terminerQuiz() {

            clearInterval(intervalle);

            document.getElementById("question").textContent =
                "Quiz terminé !";

            document.getElementById("reponses").innerHTML = "";

            document.getElementById("message").textContent =
                "Votre score final : " + score + "/" + questions.length;

            document.getElementById("temps").textContent = "0";

            // Bouton pour recommencer une partie
            const bouton = document.createElement("button");

            bouton.textContent = "Recommencer";

            // Une nouvelle partie est créée à chaque fois
            bouton.onclick = demarrer;

            document.getElementById("reponses").appendChild(bouton);
        }

        // Démarrer automatiquement le quiz une fois les questions chargées
        demarrer();
    </script>

</body>
</html>
