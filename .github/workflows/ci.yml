# ==========================================================
# QUIZBATTLE - INTÉGRATION CONTINUE (CI)
# Responsable : Alain-Patrick Gomas
# ==========================================================

# Nom affiché dans GitHub Actions
name: QuizBattle CI

# Événements déclenchant automatiquement le workflow
on:

  # Lorsqu'un développeur envoie du code sur GitHub
  push:

  # Lorsqu'une Pull Request vise la branche main
  pull_request:
    branches:
      - main

# Permissions minimales du workflow
permissions:
  contents: read

# Liste des tâches à exécuter
jobs:

  # PREMIÈRE TÂCHE : VÉRIFICATION DE L'APPLICATION
  test:

    # GitHub fournit temporairement une machine Ubuntu
    runs-on: ubuntu-latest

    steps:

      # ÉTAPE 1 : RÉCUPÉRER LE PROJET
      # Sans cette action, la machine ne possède pas notre code
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # ÉTAPE 2 : INSTALLER NODE.JS
      # Node.js servira à exécuter notre vérification
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # ÉTAPE 3 : VÉRIFIER QUE LE FRONT-END EXISTE
      # La pipeline échoue si index.html est absent
      - name: Vérifier le fichier HTML
        run: |
          test -f index.html

      # ÉTAPE 4 : VÉRIFIER LE CONTENU MINIMAL DU QUIZ
      # Le script vérifie que le fichier contient notre application
      - name: Vérifier la structure du quiz
        run: |
          node -e "const fs = require('fs'); const html = fs.readFileSync('index.html', 'utf8'); if (!html.includes('QuizBattle') || !html.includes('<html')) { process.exit(1); } console.log('Structure QuizBattle détectée');"
       
  # ==========================================================
  # DEUXIÈME TÂCHE : CONSTRUIRE LES IMAGES DOCKER
  # ==========================================================

  build:

    # Le build démarre uniquement si le job test a réussi.
    needs: test

    # GitHub fournit une machine Ubuntu.
    runs-on: ubuntu-latest

    steps:

      # Récupérer les fichiers du projet.
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # Construire l'image Docker du frontend.
      - name: Construire l'image frontend
        run: docker build -t quizbattle-front:test ./docker/frontend

      # Construire l'image Docker de l'API Node.js.
      - name: Construire l'image API
        run: docker build -t quizbattle-api:test ./api

      # Afficher les images construites pour vérification.
      - name: Afficher les images Docker
        run: docker images       