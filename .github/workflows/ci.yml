# ==========================================================
# QUIZBATTLE - INTÉGRATION CONTINUE (CI)
# Responsable : Alain-Patrick Gomas
# ==========================================================

# Nom du workflow affiché sur GitHub Actions
name: QuizBattle CI

# Événements qui déclenchent automatiquement le pipeline
on:

  # Lorsqu'un développeur envoie du code sur GitHub
  push:

  # Lorsqu'une Pull Request cible la branche principale
  pull_request:
    branches:
      - main

# Autorisation minimale : lire le contenu du dépôt
permissions:
  contents: read

# ==========================================================
# LISTE DES TÂCHES DU PIPELINE
# ==========================================================
jobs:

  # ========================================================
  # TÂCHE 1 : VÉRIFIER L'APPLICATION
  # ========================================================
  test:

    # GitHub fournit temporairement une machine Ubuntu
    runs-on: ubuntu-latest

    steps:

      # Étape 1 : récupérer le code source du projet
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # Étape 2 : installer Node.js 22
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Étape 3 : vérifier que le fichier HTML existe
      - name: Vérifier le fichier HTML
        run: |
          test -f index.html

      # Étape 4 : vérifier la structure minimale du quiz
      - name: Vérifier la structure du quiz
        run: |
          node -e "const fs = require('fs'); const html = fs.readFileSync('index.html', 'utf8'); if (!html.includes('QuizBattle') || !html.includes('<html')) { process.exit(1); } console.log('Structure QuizBattle détectée');"

  # ========================================================
  # TÂCHE 2 : CONSTRUIRE LES IMAGES DOCKER
  # ========================================================
  build:

    # La construction ne démarre que si les tests réussissent
    needs: test

    # Exécution sur une machine Ubuntu fournie par GitHub
    runs-on: ubuntu-latest

    steps:

      # Étape 1 : récupérer le code source
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # Étape 2 : construire l'image Docker du frontend
      #
      # -t : donne un nom et une version à l'image
      # -f : indique l'emplacement du Dockerfile
      # .  : définit la racine du projet comme contexte
      #
      # Le contexte racine permet aussi de copier monitoring/lib/
      - name: Construire l'image frontend
        run: docker build -t quizbattle-front:test -f docker/frontend/Dockerfile .

      # Étape 3 : construire l'image Docker de l'API Node.js
      #
      # Le Dockerfile de l'API est dans le dossier api/
      - name: Construire l'image API
        run: docker build -t quizbattle-api:test ./api

      # Étape 4 : afficher les images construites
      #
      # Permet de vérifier leur présence dans les logs GitHub
      - name: Afficher les images Docker
        run: docker images