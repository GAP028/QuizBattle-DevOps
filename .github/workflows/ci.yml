# ==========================================================
# QUIZBATTLE - PIPELINE CI/CD
# Responsable : Alain-Patrick Gomas
# ==========================================================

# Nom du pipeline dans GitHub Actions
name: QuizBattle CI/CD

# Déclenchement automatique
on:
  # À chaque push sur GitHub
  push:

  # Lorsqu'une Pull Request cible main
  pull_request:
    branches:
      - main

# Permissions minimales
permissions:
  contents: read

# ==========================================================
# TÂCHES DU PIPELINE
# ==========================================================
jobs:

  # ========================================================
  # TÂCHE 1 : VÉRIFIER L'APPLICATION
  # ========================================================
  test:
    runs-on: ubuntu-latest

    steps:

      # Récupérer le code du dépôt GitHub
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # Installer Node.js
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Vérifier que le fichier HTML existe
      - name: Vérifier le fichier HTML
        run: |
          test -f index.html

      # Vérifier la structure minimale du quiz
      - name: Vérifier la structure du quiz
        run: |
          node -e "const fs = require('fs'); const html = fs.readFileSync('index.html', 'utf8'); if (!html.includes('QuizBattle') || !html.includes('<html')) { process.exit(1); } console.log('Structure QuizBattle détectée');"

  # ========================================================
  # TÂCHE 2 : CONSTRUIRE LES IMAGES DOCKER
  # ========================================================
  build:

    # Le build ne démarre que si les tests réussissent
    needs: test

    # Machine Ubuntu fournie par GitHub
    runs-on: ubuntu-latest

    steps:

      # Récupérer le code source
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # ====================================================
      # CONSTRUCTION DU FRONTEND
      # ====================================================

      # -t : nom de l'image Docker
      # -f : chemin vers le Dockerfile
      # .  : racine du projet comme contexte de construction
      - name: Construire l'image frontend
        run: docker build -t quizbattle-front:test -f docker/frontend/Dockerfile .

      # ====================================================
      # CONSTRUCTION DE L'API
      # ====================================================

      # CORRECTION :
      # L'API utilise également la racine du projet
      # pour accéder aux fichiers api/ dans ses COPY.
      - name: Construire l'image API
        run: docker build -t quizbattle-api:test -f api/Dockerfile .

      # ====================================================
      # VÉRIFICATION DES IMAGES
      # ====================================================

      - name: Afficher les images Docker
        run: docker images

      # ====================================================
      # CONNEXION À DOCKER HUB
      # ====================================================

      # Connexion uniquement après un push sur main
      # Aucune publication depuis une Pull Request
      - name: Connexion à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ====================================================
      # VERSIONNEMENT DES IMAGES
      # ====================================================

      # Chaque image reçoit le SHA du commit Git
      # pour identifier précisément sa version.
      - name: Versionner les images Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag quizbattle-front:test gomaso/quizbattle-front:${{ github.sha }}
          docker tag quizbattle-api:test gomaso/quizbattle-api:${{ github.sha }}

      # ====================================================
      # PUBLICATION DES IMAGES SUR DOCKER HUB
      # ====================================================

      - name: Publier les images Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push gomaso/quizbattle-front:${{ github.sha }}
          docker push gomaso/quizbattle-api:${{ github.sha }}