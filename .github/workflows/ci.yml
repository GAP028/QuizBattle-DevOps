# ==========================================================
# QUIZBATTLE - PIPELINE CI/CD
# Responsable : Alain-Patrick Gomas
# ==========================================================

name: QuizBattle CI/CD

# Déclenchement automatique du pipeline
on:
  push:
  pull_request:
    branches:
      - main

# Permissions minimales
permissions:
  contents: read

jobs:

  # ========================================================
  # TÂCHE 1 : TESTER L'APPLICATION
  # ========================================================
  test:
    runs-on: ubuntu-latest

    steps:

      # Récupérer le code source
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # Installer Node.js 22
      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Vérifier la présence du frontend
      - name: Vérifier le fichier HTML
        run: |
          test -f index.html

      # Vérifier la structure minimale de QuizBattle
      - name: Vérifier la structure du quiz
        run: |
          node -e "const fs = require('fs'); const html = fs.readFileSync('index.html', 'utf8'); if (!html.includes('QuizBattle') || !html.includes('<html')) { process.exit(1); } console.log('Structure QuizBattle détectée');"

  # ========================================================
  # TÂCHE 2 : CONSTRUIRE ET PUBLIER LES IMAGES DOCKER
  # ========================================================
  build:
    # La construction démarre uniquement si les tests réussissent
    needs: test

    runs-on: ubuntu-latest

    steps:

      # Récupérer le code source
      - name: Récupérer le code source
        uses: actions/checkout@v5

      # Construire l'image Docker du frontend
      # -f indique l'emplacement du Dockerfile
      # Le point final utilise la racine du projet comme contexte
      - name: Construire l'image frontend
        run: docker build -t quizbattle-front:test -f docker/frontend/Dockerfile .

      # Construire l'image Docker de l'API
      - name: Construire l'image API
        run: docker build -f api/Dockerfile -t quizbattle-api:test .

      # Vérifier les images construites
      - name: Afficher les images Docker
        run: docker images

      # ====================================================
      # PUBLICATION AUTOMATIQUE SUR DOCKER HUB
      # ====================================================

      # Connexion uniquement après un push sur main
      # Les Pull Requests ne publient aucune image
      - name: Connexion à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Attribuer une version unique aux images
      # github.sha représente l'identifiant du commit
      - name: Versionner les images Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag quizbattle-front:test gomaso/quizbattle-front:${{ github.sha }}
          docker tag quizbattle-api:test gomaso/quizbattle-api:${{ github.sha }}

      # Publier les images sur Docker Hub
      - name: Publier les images Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push gomaso/quizbattle-front:${{ github.sha }}
          docker push gomaso/quizbattle-api:${{ github.sha }}