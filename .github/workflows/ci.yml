# ==========================================================

name: QuizBattle CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Vérifier le fichier HTML
        run: test -f index.html

      - name: Vérifier la structure du quiz
        run: |
          node -e "const fs = require('fs'); const html = fs.readFileSync('index.html', 'utf8'); if (!html.includes('QuizBattle') || !html.includes('<html')) { process.exit(1); } console.log('Structure QuizBattle détectée');"

      - name: Installer les dépendances de l'API
        working-directory: api
        run: npm ci

      - name: Construire l'image Docker de l'API
        run: docker build -t quizbattle-api:test ./api
